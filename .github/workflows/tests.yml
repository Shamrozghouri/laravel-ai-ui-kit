name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: 8.1
            laravel: 10.*
            illuminate: 10.*
          - php: 8.2
            laravel: 10.*
            illuminate: 10.*
          - php: 8.3
            laravel: 10.*
            illuminate: 10.*
          - php: 8.2
            laravel: 11.*
            illuminate: 11.*
          - php: 8.3
            laravel: 11.*
            illuminate: 11.*
          - php: 8.2
            laravel: 12.*
            illuminate: 12.*
          - php: 8.3
            laravel: 12.*
            illuminate: 12.*
          - php: 8.4
            laravel: 12.*
            illuminate: 12.*
          - php: 8.3
            laravel: 13.*
            illuminate: 13.*
          - php: 8.4
            laravel: 13.*
            illuminate: 13.*
          - php: 8.5
            laravel: 13.*
            illuminate: 13.*
          - php: 8.5
            laravel: latest stable
            illuminate: '*'

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts=${{ matrix.illuminate }}" --no-interaction --no-update
          # Laravel 10 and 11 are kept in the matrix to verify backwards
          # compatibility even though Composer now blocks their known advisories.
          composer update --prefer-dist --no-interaction --no-progress --no-audit --no-blocking

      - name: Run test suite
        run: vendor/bin/phpunit

  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: PHPStan
        run: vendor/bin/phpstan analyse

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pint (dry run)
        run: vendor/bin/pint --test
